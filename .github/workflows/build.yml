name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# A newer push to the same branch or PR supersedes a run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.10.3

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version resource is read from the latest tag
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
      # Ninja runs the compiler directly, so each build needs the MSVC environment of its architecture.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      # SLikeNet finds the runner's preinstalled OpenSSL; the launcher calls none of it, so the package
      # needs no OpenSSL DLLs.
      - name: Build launcher
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          cmake --build build
          cmake --install build --prefix "$PWD/dist"
      # Gothic is 32-bit, so the injector is built for Win32 on its own. The launcher stays 64-bit.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Build injector
        run: |
          cmake -S src/injector -B build-injector -G Ninja -DCMAKE_BUILD_TYPE=Release -Wno-dev
          cmake --build build-injector
          cmake --install build-injector --prefix "$PWD/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: gml-windows
          path: dist/

  linux:
    # Built against Ubuntu 24.04's Qt 6.4
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build qt6-base-dev libssl-dev
      - name: Build launcher
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          cmake --install build --prefix dist
      # A tar keeps the executable bits that upload-artifact would drop.
      - run: tar -cf gml-linux.tar -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: gml-linux
          path: gml-linux.tar

  package:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gml-windows
          path: windows
      - uses: actions/download-artifact@v4
        with:
          name: gml-linux
      # The Linux launcher runs the Windows injector under Wine.
      - name: Assemble
        run: |
          tar -rf gml-linux.tar -C windows ./gmpinjector.exe
          gzip gml-linux.tar
          (cd windows && zip -qr ../gml-windows.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: gml-packages
          path: |
            gml-windows.zip
            gml-linux.tar.gz
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" gml-windows.zip gml-linux.tar.gz --repo "$GITHUB_REPOSITORY" --generate-notes
